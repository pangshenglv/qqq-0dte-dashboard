<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QQQ 0DTE 盯盘看板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">📈</span>
    <h1>QQQ 0DTE 盯盘看板</h1>
  </div>
  <div class="controls">
    <label for="daySelect">交易日</label>
    <select id="daySelect"></select>
    <span id="updated" class="updated"></span>
    <label class="auto"><input type="checkbox" id="autoRefresh" checked> 60s 自动刷新</label>
  </div>
</header>

<section id="statusStrip" class="status-strip"></section>

<nav class="tabs">
    <button id="tabTrade" class="tab active">📋 交易</button>
    <button id="tabTodo" class="tab">🛠 待优化 <span id="todoCount" class="count"></span></button>
  </nav>

  <main id="viewTrade">
  <section class="panel">
    <h2>🧠 AI 策略方案时间线 <span id="snapCount" class="count"></span></h2>
    <div id="timeline" class="timeline"></div>
  </section>

  <section class="panel">
    <h2>📋 委托记录 <span id="pnlBadge" class="pnl-badge"></span></h2>
    <div id="orders"></div>
    <details class="raw-events">
      <summary>原始事件流水</summary>
      <table id="eventTable"><thead>
        <tr><th>时间 (ET)</th><th>事件</th><th>状态</th><th>方向</th><th>形态</th><th>价格/限价</th><th>备注</th></tr>
      </thead><tbody></tbody></table>
    </details>
  </section>
</main>

  <main id="viewTodo" hidden>
    <section class="panel">
      <h2>🛠 待优化清单 <span class="count">数据源 docs/backlog.md</span></h2>
      <div id="todos"></div>
    </section>
  </main>

<footer id="foot"></footer>
<script src="app.js"></script>
</body>
</html>
